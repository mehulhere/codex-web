<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <title>Codex Mobile · Host unavailable</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: #101010;
        color: #f2f2f2;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 390px);
        padding: 24px;
        border: 1px solid #2d2d2d;
        border-radius: 18px;
        background: #151515;
        box-sizing: border-box;
      }
      .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        margin-bottom: 20px;
        border-radius: 999px;
        background: #252525;
        color: #b3b3b3;
        font-size: 22px;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: #a3a3a3; line-height: 1.55; }
      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        border-radius: 9px;
        padding: 11px 16px;
        background: #f2f2f2;
        color: #101010;
        font: inherit;
        font-weight: 600;
      }
      button:disabled { opacity: 0.6; }
      .option {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 18px;
        padding: 12px;
        border: 1px solid #2d2d2d;
        border-radius: 12px;
      }
      input { width: 17px; height: 17px; margin: 1px 0 0; accent-color: #f2f2f2; }
      label { font-size: 14px; font-weight: 600; line-height: 1.3; }
      #status { margin-top: 5px; font-size: 12px; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">↯</div>
      <h1>Codex Mobile is offline</h1>
      <p>Start Codex Mobile on the laptop and make sure it is connected to Tailscale.</p>
      <button id="refresh" type="button">Refresh</button>
      <div class="option">
        <input id="auto-retry" type="checkbox" />
        <div>
          <label for="auto-retry">Check automatically every 10 seconds</label>
          <p id="status" aria-live="polite">Turn this on to reconnect automatically.</p>
        </div>
      </div>
    </main>
    <script>
      const AUTO_RETRY_STORAGE_KEY = "farfield.connection-auto-retry.v1";
      const CHECK_INTERVAL_MS = 10_000;
      const refreshButton = document.getElementById("refresh");
      const autoRetryCheckbox = document.getElementById("auto-retry");
      const statusText = document.getElementById("status");
      let checking = false;
      let intervalId = null;

      try {
        autoRetryCheckbox.checked = localStorage.getItem(AUTO_RETRY_STORAGE_KEY) === "enabled";
      } catch {
        autoRetryCheckbox.checked = false;
      }

      async function checkHost() {
        if (checking) return;
        checking = true;
        refreshButton.disabled = true;
        refreshButton.textContent = "Checking…";
        statusText.textContent = "Checking the laptop service…";
        try {
          const response = await fetch(`/api/health?availability-check=${Date.now()}`, {
            cache: "no-store"
          });
          if (response.status >= 500) {
            throw new Error("Host unavailable");
          }
          location.reload();
        } catch {
          statusText.textContent = autoRetryCheckbox.checked
            ? "Still offline. Checking again in 10 seconds."
            : "Still offline. Press Refresh to try again.";
        } finally {
          checking = false;
          refreshButton.disabled = false;
          refreshButton.textContent = "Refresh";
        }
      }

      function syncAutoRetry() {
        if (intervalId !== null) {
          clearInterval(intervalId);
          intervalId = null;
        }
        if (autoRetryCheckbox.checked) {
          statusText.textContent = "Checking every 10 seconds.";
          intervalId = setInterval(checkHost, CHECK_INTERVAL_MS);
        } else {
          statusText.textContent = "Turn this on to reconnect automatically.";
        }
      }

      refreshButton.addEventListener("click", checkHost);
      autoRetryCheckbox.addEventListener("change", () => {
        try {
          localStorage.setItem(
            AUTO_RETRY_STORAGE_KEY,
            autoRetryCheckbox.checked ? "enabled" : "disabled"
          );
        } catch {
          // The current page can still keep checking while storage is unavailable.
        }
        syncAutoRetry();
      });
      syncAutoRetry();
    </script>
  </body>
</html>
